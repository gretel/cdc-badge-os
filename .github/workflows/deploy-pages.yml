name: Deploy GitHub Pages

on:
  release:
    types: [published]
  push:
    branches: [main, release]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'components/**'
      - 'main/**'
      - 'Doxyfile'
      - 'web-flasher/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Doxygen 1.16.1
        run: |
          set -euo pipefail
          DOXYGEN_VERSION="1.16.1"
          DOXYGEN_ARCHIVE="/tmp/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"

          for URL in \
            "https://www.doxygen.nl/files/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" \
            "https://downloads.sourceforge.net/project/doxygen/rel-${DOXYGEN_VERSION}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          do
            echo "Downloading ${URL}"
            if curl --fail --location --retry 3 --retry-delay 5 --output "${DOXYGEN_ARCHIVE}" "${URL}"; then
              break
            fi
          done

          test -s "${DOXYGEN_ARCHIVE}"
          tar -tzf "${DOXYGEN_ARCHIVE}" > /dev/null
          sudo rm -rf /opt/doxygen-1.16.1
          sudo mkdir -p /opt/doxygen-1.16.1
          sudo tar -xzf "${DOXYGEN_ARCHIVE}" -C /opt/doxygen-1.16.1 --strip-components=1
          sudo ln -sf /opt/doxygen-1.16.1/bin/doxygen /usr/local/bin/doxygen

      - name: Verify Doxygen version
        run: |
          DOXYGEN_VERSION="$(doxygen --version)"
          echo "Using Doxygen ${DOXYGEN_VERSION}"
          echo "${DOXYGEN_VERSION}" | grep -E '^1\.16\.1([[:space:]].*)?$'

      - name: Build Doxygen documentation
        run: doxygen Doxyfile

      - name: Get latest release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          else
            TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Assemble site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p _site/docs

          # Web Flasher at root
          cp web-flasher/index.html _site/
          cp web-flasher/badge.jpg _site/

          # Doxygen docs
          cp -r doxygen_output/html/* _site/docs/

          # Download firmware binaries (skip if no release exists)
          if [ -n "$TAG" ]; then
            gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --dir _site \
              --pattern "*.bin"

            mv "_site/cdc-badge-bootloader-${TAG}.bin" _site/bootloader.bin
            mv "_site/cdc-badge-partitions-${TAG}.bin" _site/partitions.bin
            mv "_site/cdc-badge-firmware-${TAG}.bin" _site/firmware.bin
            if [ -f "_site/cdc-badge-plugins-initial-${TAG}.bin" ]; then
              mv "_site/cdc-badge-plugins-initial-${TAG}.bin" _site/plugins_initial.bin
            fi

            cat > _site/manifest.json << MANIFEST
          {
            "name": "CDC Badge OS (Firmware Update)",
            "version": "${TAG}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin", "offset": 0 },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "firmware.bin", "offset": 327680 }
                ]
              }
            ]
          }
          MANIFEST

            if [ -f "_site/plugins_initial.bin" ]; then
              cat > _site/manifest_factory.json << MANIFEST
          {
            "name": "CDC Badge OS (Factory Setup)",
            "version": "${TAG}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin",      "offset": 0 },
                  { "path": "partitions.bin",      "offset": 32768 },
                  { "path": "firmware.bin",        "offset": 327680 },
                  { "path": "plugins_initial.bin", "offset": 14614528 }
                ]
              }
            ]
          }
          MANIFEST
            fi
          else
            echo "No release found, skipping firmware binaries"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
